name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        include:
          # нижняя и верхняя границы поддерживаемых версий — на одной ОС хватит
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: smoke test stdio-режима
        shell: bash
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | yandex-mcp > out.json
          python -c "import json;d=json.load(open('out.json', encoding='utf-8'));assert len(d['result']['tools'])==12, d"
      - name: smoke test CLI
        shell: bash
        env:
          YANDEX_MCP_KEYSTORE: file
        run: |
          yandex-mcp status
          yandex-mcp --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - name: метаданные пакета пригодны для PyPI
        run: twine check dist/*
      - name: имя сервера в README совпадает с server.json
        run: |
          python - <<'EOF'
          import json, pathlib
          name = json.loads(pathlib.Path("server.json").read_text())["name"]
          readme = pathlib.Path("README.md").read_text()
          assert f"mcp-name: {name}" in readme, (
              "реестр MCP проверяет владение пакетом по строке mcp-name в README — "
              f"она должна содержать {name}")
          version = json.loads(pathlib.Path("server.json").read_text())["version"]
          pyproject = pathlib.Path("pyproject.toml").read_text()
          assert f'version = "{version}"' in pyproject, (
              "версия в server.json разошлась с pyproject.toml")
          print("ok:", name, version)
          EOF
