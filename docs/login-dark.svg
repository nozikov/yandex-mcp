<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" role="img">
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  .title { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; fill: #9198a1; }
  .lbl { font-size: 12px; fill: #9198a1; }
  .step { font-size: 13px; fill: #e6edf3; }
  .cap { font-size: 11px; letter-spacing: .1em; fill: #9198a1; }
  .box { stroke-width: 1.5; }
  .arrow { stroke: #9198a1; stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="a" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto">
    <path d="M0 0 L8 3 L0 6 z" fill="#9198a1"/>
  </marker>
</defs>

<circle cx="42" cy="46" r="15" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
<text class="m" x="42" y="51" text-anchor="middle" font-size="14" font-weight="600" fill="#4493f8">1</text>
<text class="t" x="70" y="44" font-size="14" font-weight="600" fill="#e6edf3">Скажи агенту</text>
<text class="t sub" x="70" y="64">«Подключи Яндекс»</text>
<path class="arrow" d="M252 46 L282 46" marker-end="url(#a)"/>
<circle cx="312" cy="46" r="15" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
<text class="m" x="312" y="51" text-anchor="middle" font-size="14" font-weight="600" fill="#4493f8">2</text>
<text class="t" x="340" y="44" font-size="14" font-weight="600" fill="#e6edf3">Открой ссылку</text>
<text class="t sub" x="340" y="64">и подтверди доступ</text>
<text class="t sub" x="340" y="80">в браузере Яндекса</text>
<path class="arrow" d="M522 46 L552 46" marker-end="url(#a)"/>
<circle cx="582" cy="46" r="15" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
<text class="m" x="582" y="51" text-anchor="middle" font-size="14" font-weight="600" fill="#4493f8">3</text>
<text class="t" x="610" y="44" font-size="14" font-weight="600" fill="#e6edf3">Верни код в чат</text>
<text class="t sub" x="610" y="64">Яндекс покажет его</text>
<text class="t sub" x="610" y="80">на странице</text>
<rect x="20" y="118" width="820" height="58" rx="6" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text class="t" x="430" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#3fb950">Токен лёг в хранилище операционной системы</text>
<text class="t sub" x="430" y="163" text-anchor="middle">Терминал не нужен. Перезапускать сервер не нужно. Действует около года.</text>
</svg>